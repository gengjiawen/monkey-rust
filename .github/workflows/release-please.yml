name: release-please

on:
  push:
    branches:
      - main
      - release_extra
  workflow_dispatch:
    inputs:
      resume_publish:
        description: 'Run the publish chain for the versions on this branch, skipping whatever is already on the registries'
        type: boolean
        default: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    container:
      image: gengjiawen/node-build
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          package-name: monkey-rust
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node
          changelog-types: >
            [
              {"type":"compiler","section":"compiler","hidden":false},
              {"type":"feat","section":"Features","hidden":false},
              {"type":"fix","section":"Bug Fixes","hidden":false},
              {"type":"dev","section":"Dev","hidden":false},
              {"type":"doc","section":"Doc","hidden":false},
              {"type":"playground","section":"playground","hidden":false},
              {"type":"meta","section":"Miscellaneous","hidden":false}
            ]
      # `release_created` is true on exactly one run — the one whose push merged
      # the release PR. Gating the publish chain on it alone means a release
      # that dies partway through cannot be finished by re-running the
      # workflow: the retry skips every step and reports success, so nothing
      # downstream of the failure ever gets published. Making the steps
      # idempotent only helps if the chain can be entered a second time.
      #
      # So the chain needs a second entrance, and exactly one: a dispatch with
      # `resume_publish` checked. Re-entering is safe once asked for —
      # `cargo workspaces publish --from-git` reports "already published" and
      # moves on, `ovsx publish` runs with `--skip-duplicate`, and every npm
      # package goes through `scripts/npm-publish-if-needed.sh` — but it must
      # stay something a maintainer asks for. A run attempt number is not that
      # ask: re-running this workflow for an unrelated failure would then
      # publish whatever versions happen to be in the tree, with no release
      # behind them.
      - id: publish
        name: Decide whether to run the publish chain
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RESUME_REQUESTED: ${{ inputs.resume_publish }}
        run: |
          if [ "$RELEASE_CREATED" = "true" ] || [ "$RESUME_REQUESTED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "publishing: release_created=$RELEASE_CREATED resume=$RESUME_REQUESTED"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "no release to publish"
          fi
      - name: Trigger prepare-release for open release PR
        uses: actions/github-script@v7
        if: ${{ steps.release.outputs.release_created != 'true' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo
            const baseBranch = context.ref.replace('refs/heads/', '')
            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: baseBranch,
              per_page: 100,
            })

            const releasePr = pulls.find((pr) => {
              const byRef = pr.head.ref.startsWith('release-') || pr.head.ref.startsWith('release/')
              const byTitle = /^chore: release\b/i.test(pr.title)
              return byRef || byTitle
            })

            if (!releasePr) {
              core.info('No open release PR found, skipping prepare-release dispatch.')
              return
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'prepare-release.yml',
              ref: releasePr.head.ref,
            })
            core.info(`Triggered prepare-release.yml on ${releasePr.head.ref}`)
      - uses: actions/checkout@v6
      - name: Pin npm to 11.x
        if: ${{ steps.publish.outputs.enabled == 'true' }}
        run: npm install -g npm@11
      - run: npx envinfo
      - run: cargo workspaces publish --from-git --token $CARGO_TOKEN
        env:
          CARGO_TOKEN: ${{secrets.CARGO_TOKEN}}
        if: ${{ steps.publish.outputs.enabled == 'true' }}
      - run: cd wasm && wasm-pack build --release --scope=gengjiawen
        if: ${{ steps.publish.outputs.enabled == 'true' }}
      - run: scripts/npm-publish-if-needed.sh wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
        if: ${{ steps.publish.outputs.enabled == 'true' }}
      - run: pnpm install --filter prettier-plugin-monkey... --frozen-lockfile && pnpm --filter prettier-plugin-monkey run build
        if: ${{ steps.publish.outputs.enabled == 'true' }}
      - run: scripts/npm-publish-if-needed.sh packages/prettier-plugin-monkey
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
        if: ${{ steps.publish.outputs.enabled == 'true' }}
      - run: pnpm install --filter @gengjiawen/monkey-minifier... --frozen-lockfile && pnpm --filter @gengjiawen/monkey-minifier run build
        if: ${{ steps.publish.outputs.enabled == 'true' }}
      - run: scripts/npm-publish-if-needed.sh packages/monkey-minifier
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
        if: ${{ steps.publish.outputs.enabled == 'true' }}
      - run: pnpm install --filter @gengjiawen/monkey-lint... --frozen-lockfile && pnpm --filter @gengjiawen/monkey-lint run build
        if: ${{ steps.publish.outputs.enabled == 'true' }}
      - run: scripts/npm-publish-if-needed.sh packages/monkey-linter
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
        if: ${{ steps.publish.outputs.enabled == 'true' }}
      # The extension bundles the checker, so build and publish it together
      # immediately before packaging the extension.
      - name: Build Monkey typechecker
        if: ${{ steps.publish.outputs.enabled == 'true' }}
        run: pnpm install --filter @gengjiawen/monkey-typechecker... --frozen-lockfile && pnpm --filter @gengjiawen/monkey-typechecker run build
      - name: Publish Monkey typechecker
        if: ${{ steps.publish.outputs.enabled == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
        run: scripts/npm-publish-if-needed.sh packages/monkey-typechecker
      - name: Publish VS Code extension to Open VSX
        if: ${{ steps.publish.outputs.enabled == 'true' }}
        working-directory: packages/vscode-extension
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN }}
        run: |
          pnpm install --filter monkey-extension... --frozen-lockfile
          rm -f *.vsix
          pnpm run package
          pnpm exec ovsx publish --skip-duplicate --pat "$OVSX_PAT" *.vsix
